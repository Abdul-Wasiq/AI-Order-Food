<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AI Food Order Line — Phase 1 Test</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 560px;
    margin: 60px auto;
    text-align: center;
    background: #111;
    color: #eee;
  }
  button {
    font-size: 18px;
    padding: 14px 28px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    margin-top: 24px;
  }
  #startBtn { background: #2ecc71; color: #063; }
  #stopBtn { background: #e74c3c; color: #300; }
  #status {
    margin-top: 20px;
    font-size: 15px;
    color: #9ad;
    min-height: 24px;
  }
  #log {
    margin-top: 30px;
    text-align: left;
    background: #1b1b1b;
    border-radius: 8px;
    padding: 14px;
    max-height: 320px;
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.5;
  }
  .you { color: #7fd1ff; }
  .ai { color: #ffd27f; }
</style>
</head>
<body>

<h2>📞 AI Food Order Line — Phase 1</h2>
<p>Click Start, allow mic access, then talk like you're calling in an order.</p>

<button id="startBtn">Start Call</button>
<button id="stopBtn" disabled>End Call</button>

<div id="status">Not connected</div>
<div id="log"></div>

<script>
const WS_URL = "ws://localhost:8000/media-stream";

let ws = null;
let audioContext = null;
let micStream = null;
let micProcessor = null;

// Playback queue for AI audio chunks (24kHz PCM16 from Gemini)
let playbackContext = null;
let nextPlaybackTime = 0;

const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");

function setStatus(text) {
  statusEl.textContent = text;
}

function logLine(who, text) {
  const div = document.createElement("div");
  div.className = who === "you" ? "you" : "ai";
  div.textContent = (who === "you" ? "🧑 You: " : "🤖 AI: ") + text;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

async function startCall() {
  startBtn.disabled = true;
  setStatus("Connecting...");

  ws = new WebSocket(WS_URL);
  ws.binaryType = "arraybuffer";

  ws.onopen = async () => {
    setStatus("Connected — listening 🎙️");
    stopBtn.disabled = false;
    await startMic();
  };

  ws.onmessage = (event) => {
    if (typeof event.data === "string") {
      // Text messages (used in later phases for structured signals).
      // For Phase 1 this mostly won't fire, but we handle it just in case.
      console.log("Text message from server:", event.data);
      return;
    }
    // Binary = raw PCM16 audio from Gemini, play it back.
    playAudioChunk(event.data);
  };

  ws.onclose = () => {
    setStatus("Call ended");
    cleanup();
  };

  ws.onerror = (err) => {
    console.error("WebSocket error:", err);
    setStatus("Connection error — check the backend is running");
  };
}

async function startMic() {
  micStream = await navigator.mediaDevices.getUserMedia({ audio: true });

  // Gemini Live expects 16kHz mono PCM16 input.
  audioContext = new AudioContext({ sampleRate: 16000 });
  const source = audioContext.createMediaStreamSource(micStream);

  // ScriptProcessorNode is deprecated but still the simplest cross-browser
  // way to get raw PCM frames without pulling in extra libraries. Fine for
  // a test/demo project like this.
  micProcessor = audioContext.createScriptProcessor(4096, 1, 1);

  micProcessor.onaudioprocess = (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;

    const input = e.inputBuffer.getChannelData(0);
    const pcm16 = floatTo16BitPCM(input);
    ws.send(pcm16);
  };

  source.connect(micProcessor);
  micProcessor.connect(audioContext.destination);
}

function floatTo16BitPCM(floatData) {
  const buffer = new ArrayBuffer(floatData.length * 2);
  const view = new DataView(buffer);
  for (let i = 0; i < floatData.length; i++) {
    let s = Math.max(-1, Math.min(1, floatData[i]));
    view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return buffer;
}

function playAudioChunk(arrayBuffer) {
  if (!playbackContext) {
    // Gemini Live outputs 24kHz PCM16 audio.
    playbackContext = new AudioContext({ sampleRate: 24000 });
    nextPlaybackTime = playbackContext.currentTime;
  }

  const int16 = new Int16Array(arrayBuffer);
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) {
    float32[i] = int16[i] / 32768;
  }

  const audioBuffer = playbackContext.createBuffer(1, float32.length, 24000);
  audioBuffer.copyToChannel(float32, 0);

  const source = playbackContext.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(playbackContext.destination);

  // Schedule chunks back-to-back so playback doesn't stutter or overlap.
  const startAt = Math.max(nextPlaybackTime, playbackContext.currentTime);
  source.start(startAt);
  nextPlaybackTime = startAt + audioBuffer.duration;
}

function stopCall() {
  if (ws) ws.close();
  cleanup();
}

function cleanup() {
  startBtn.disabled = false;
  stopBtn.disabled = true;

  if (micProcessor) {
    micProcessor.disconnect();
    micProcessor = null;
  }
  if (audioContext) {
    audioContext.close();
    audioContext = null;
  }
  if (micStream) {
    micStream.getTracks().forEach((t) => t.stop());
    micStream = null;
  }
}

startBtn.addEventListener("click", startCall);
stopBtn.addEventListener("click", stopCall);
</script>

</body>
</html>
